<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/agent-icons/claude.svg" />
    <title>awesome-harness</title>
    <script>
      // Apply the saved theme before first paint (src/lib/theme.js keeps it in sync afterwards).
      try {
        var pref = (JSON.parse(localStorage.getItem("ah_prefs") || "null") || {}).theme
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        var root = document.documentElement
        root.setAttribute("data-color-mode", dark ? "dark" : "light")
        root.setAttribute("data-light-theme", "light")
        root.setAttribute("data-dark-theme", "dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
