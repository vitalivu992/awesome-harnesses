name: Build and Tag

# On every push to master/main:
#   1. bump the patch version in package.json
#   2. build the web bundle, run tests, compile the server
#   3. ONLY if every step above succeeds, commit the version bump, create a
#      LIGHTWEIGHT git tag v<version>, and push both back to the branch.
#
# Reproducibility: the tag points at the commit that already contains the
# matching version in package.json. Checking out the tag and running
# `pnpm install --frozen-lockfile && pnpm build && go build ./cmd/server`
# reproduces that release's tree.
#
# Portable: no host, repo, branch, or token is hardcoded.

on:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump patch version
        run: |
          npm version patch --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: Build web bundle
        run: pnpm build

      - name: Unit tests (vitest)
        run: pnpm test:unit

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build server
        run: CGO_ENABLED=1 go build -o bin/server ./cmd/server

      - name: Configure git, set remote, and commit version bump
        env:
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          host="${SERVER_URL#https://}"; host="${host#http://}"; host="${host%/}"
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@noreply.${host}"
          git remote set-url origin "https://x-access-token:${TOKEN}@${host}/${REPOSITORY}.git"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ env.PKG_NAME }}-v${{ env.NEW_VERSION }}-linux-amd64
          path: bin/server
          if-no-files-found: error

      - name: Create lightweight tag and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git tag "v${NEW_VERSION}"
          git push origin "HEAD:${BRANCH}"
          git push origin "v${NEW_VERSION}"
