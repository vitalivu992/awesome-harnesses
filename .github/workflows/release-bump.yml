name: Release (minor bump)

# Triggered when a release is published from a tag. It bumps the MINOR version
# in package.json, commits it to the default branch, and creates a LIGHTWEIGHT
# tag v<minor> (e.g. v0.2.0) for that version.
#
# The bump commit carries "[skip ci]" so it does not itself trigger build.yml.
# The next real push then produces the first patch tag of the new minor
# (e.g. v0.2.0 -> v0.2.1 on the next push).
#
# Portable: no host, repo, branch, or token is hardcoded.

on:
  release:
    types: [published]

concurrency:
  group: release-minor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  minor-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump minor version
        run: |
          npm version minor --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Commit minor bump, tag, and push
        env:
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          host="${SERVER_URL#https://}"; host="${host#http://}"; host="${host%/}"
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@noreply.${host}"
          git remote set-url origin "https://x-access-token:${TOKEN}@${host}/${REPOSITORY}.git"
          git add package.json
          git commit -m "chore(release): minor bump to v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          git push origin "v${NEW_VERSION}"
